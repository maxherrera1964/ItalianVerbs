<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espressioni: Love is Blind</title>
<style>
  :root {
    --bg: #f6f3ee; --card: #ffffff; --ink: #1f2328; --muted: #6b6f76;
    --accent: #b8432f; --lit: #2f6db8; --line: #e3ded6; --warn: #9a6a00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --card: #222427; --ink: #ececec; --muted: #9aa0a6;
            --accent: #e0735f; --lit: #6ea3e6; --line: #33363a; --warn: #e2b04a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; text-align: center; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: .95rem; text-align: center; max-width: 440px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; max-width: 460px; }
  .chip { font-size: .85rem; padding: 6px 12px; border-radius: 999px; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .scene { width: 100%; max-width: 440px; height: 320px; perspective: 1000px; cursor: pointer; }
  .card { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
          background: var(--card); border: 1px solid var(--line); border-radius: 16px;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          padding: 24px; text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,.06); overflow: auto; }
  .back { transform: rotateY(180deg); }
  .tag { position: absolute; top: 12px; font-size: .75rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .tag.vulg { color: var(--warn); }
  .expr { font-size: 1.6rem; font-weight: 600; line-height: 1.3; }
  .hint { position: absolute; bottom: 12px; font-size: .8rem; color: var(--muted); }
  .meaning { font-size: 1.35rem; font-weight: 700; color: var(--accent); line-height: 1.3; }
  .literal { margin-top: 8px; font-size: .95rem; color: var(--lit); }
  .ex { margin-top: 14px; font-size: 1.02rem; line-height: 1.5; font-style: italic; }
  .exen { margin-top: 4px; font-size: .9rem; color: var(--muted); }
  .note { margin-top: 10px; font-size: .85rem; color: var(--muted); }
  .controls { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  .count { margin-top: 14px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
  <h1>Espressioni da memorizzare: Love is Blind</h1>
  <p class="sub">Espressioni che si sentono nel programma. Tocca la carta per girarla.</p>

  <div class="chips" id="chips"></div>

  <div class="scene" id="scene">
    <div class="card" id="card">
      <div class="face front">
        <div class="tag" id="tagF"></div>
        <div class="expr" id="expr"></div>
        <div class="hint" id="hint">cosa vuol dire?</div>
      </div>
      <div class="face back">
        <div class="tag" id="tagB"></div>
        <div class="meaning" id="meaning"></div>
        <div class="literal" id="literal"></div>
        <div class="ex" id="ex"></div>
        <div class="exen" id="exen"></div>
        <div class="note" id="note"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="prev">← Indietro</button>
    <button id="flip">Gira</button>
    <button id="next">Avanti →</button>
    <button id="shuffle">Mescola</button>
    <button id="speak">🔊 Ascolta</button>
    <button id="dir">IT → EN</button>
  </div>
  <div class="count" id="count"></div>

<script>
// [category, expression, meaning, literal, example (it), example (en), note]
const cards = [
  ["Sentimenti", "Non vedo l'ora (di…)", "I can't wait (to…)", "lit. \"I don't see the hour\"",
   "Non vedo l'ora di abbracciarti.", "I can't wait to hug you.", "The most repeated phrase in the whole show."],
  ["Sentimenti", "Ci tengo (a te)", "I care (about you) / it matters to me", "lit. \"I hold to it\"",
   "Ci tengo a te, non ti voglio perdere.", "I care about you, I don't want to lose you.", "Ci tengo a… also = I'm keen to…: ci tengo a parlarti."],
  ["Sentimenti", "Mi piace a pelle", "I like him/her instinctively", "lit. \"I like him on the skin\"",
   "Davide mi piace a pelle.", "I just instinctively like Davide.", "Also: non mi piace a pelle = something about him rubs me the wrong way."],
  ["Sentimenti", "Scelte di pancia", "gut decisions", "lit. \"choices of the belly\"",
   "Ho sempre preso scelte di pancia.", "I've always made gut decisions.", ""],
  ["Sentimenti", "È la persona che fa per me", "he/she is the right one for me", "lit. \"the person who does for me\"",
   "Non è una persona che fa per me.", "He's not the one for me.", "Works for things too: questo lavoro non fa per me."],
  ["Sentimenti", "Con il cuore in mano", "from the heart, in all sincerity", "lit. \"with my heart in my hand\"",
   "Te ne parlo proprio con il cuore in mano.", "I'm telling you this straight from the heart.", ""],
  ["Sentimenti", "Avere il cuore a mille", "my heart is racing", "lit. \"the heart at a thousand\"",
   "Sento il cuore a mille.", "My heart is pounding.", ""],
  ["Sentimenti", "Mettersi in gioco", "to put yourself out there, to take the risk", "lit. \"to put yourself in play\"",
   "Ho cercato di mettermi in gioco.", "I tried to put myself out there.", ""],
  ["Sentimenti", "Mi ha fatto sentire a casa", "he/she made me feel at home", "",
   "Giovanni mi ha fatto sentire a casa.", "Giovanni made me feel safe and comfortable.", ""],
  ["Sentimenti", "Rimanerci male", "to be hurt / let down by something", "lit. \"to remain there badly\"",
   "Ci sono rimasto male, ma è normale.", "I was hurt, but that's normal.", "On the show they say \"mi sono rimasto male\" — the correct form is ci sono rimasto/a male."],
  ["Sentimenti", "Prendere in giro (qualcuno)", "to tease / to lead someone on", "lit. \"to take someone around\"",
   "Non sono qui a prenderla in giro.", "I'm not here to lead her on.", "Ridere, scherzare, prenderci in giro = laughing, joking, teasing each other."],
  ["Sentimenti", "Siete il giorno e la notte", "you're total opposites", "lit. \"you're day and night\"",
   "Siete diversi, siete proprio il giorno e la notte.", "You're different — total opposites.", ""],

  ["Atteggiamento", "Mandare tutto a gambe all'aria", "to wreck everything", "lit. \"to send it all legs in the air\"",
   "Non penso che si debba mandare tutto a gambe all'aria.", "I don't think we should throw it all away.", ""],
  ["Atteggiamento", "Fasciarsi la testa prima di essersela rotta", "to worry about a problem before it happens", "lit. \"to bandage your head before you've broken it\"",
   "Non fasciamoci la testa prima di essercela rotta.", "Let's not borrow trouble.", "A favorite Italian proverb."],
  ["Atteggiamento", "Stare con i piedi per terra", "to stay grounded and realistic", "lit. \"to stay with your feet on the ground\"",
   "È giusto stare un attimino con i piedi per terra.", "It's right to keep our feet on the ground a bit.", ""],
  ["Atteggiamento", "Mettersi nei panni di qualcuno", "to put yourself in someone's shoes", "lit. \"in someone's clothes\"",
   "Se mi metto nei panni dei miei genitori, è difficile.", "If I put myself in my parents' shoes, it's hard.", ""],
  ["Atteggiamento", "Avere le idee chiare", "to know what you want", "lit. \"to have clear ideas\"",
   "Ho le idee chiare su quello che voglio.", "I know exactly what I want.", ""],
  ["Atteggiamento", "Avere qualcuno sulle spalle", "to be responsible for someone", "lit. \"to have someone on your shoulders\"",
   "Ho dieci persone sulle spalle.", "I have ten people depending on me.", ""],
  ["Atteggiamento", "Ricominciare da zero", "to start over from scratch", "lit. \"to restart from zero\"",
   "Mi sono dovuta ricostruire da zero.", "I had to rebuild myself from scratch.", ""],
  ["Atteggiamento", "Ci sa fare", "he/she is smooth, knows how to handle people", "lit. \"he knows how to do (with it)\"",
   "La persona che ti corteggia, che ci sa fare…", "The person who courts you, who's smooth…", "Often said with a hint of suspicion."],
  ["Atteggiamento", "Trovare la fregatura", "to get ripped off / to find the catch", "",
   "Ho paura di trovarmi la fregatura.", "I'm afraid I'll get burned.", "Che fregatura! = What a rip-off!"],
  ["Atteggiamento", "Una persona in gamba", "a capable, smart person", "lit. \"a person in leg\"",
   "È una persona in gamba, è brillante.", "He's a really capable guy, he's brilliant.", ""],
  ["Atteggiamento", "Ci sta", "that's fair / that makes sense", "lit. \"it stays there\"",
   "Però ci sta, perché adesso c'è l'ombra.", "But that makes sense, because it's in the shade now.", "Very current everyday slang."],

  ["Parlato", "Mi raccomando!", "please make sure! / don't forget!", "lit. \"I recommend myself\"",
   "Tieni la mia giacca, mi raccomando.", "Hold my jacket — take care of it.", ""],
  ["Parlato", "Figurati!", "don't mention it! / no way!", "lit. \"imagine!\"",
   "— Grazie! — Figurati!", "— Thanks! — Don't mention it!", ""],
  ["Parlato", "Mannaggia!", "darn it!", "",
   "Mannaggia, ho dimenticato le chiavi!", "Darn it, I forgot my keys!", "Mild — fine with anyone."],
  ["Parlato", "Ad una certa…", "at a certain point…", "lit. \"at a certain (hour)\"",
   "Sono stato interrotto 18 volte, ad una certa…", "I was interrupted 18 times — at some point…", "Colloquial and a bit ungrammatical, but you hear it everywhere."],
  ["Parlato", "Un sacco / un botto", "a lot", "lit. \"a sack / a bang\"",
   "Mi trovo un sacco bene.", "I feel really good here.", "Un botto is slangier."],
  ["Parlato", "Mi fai pena", "I feel sorry for you", "lit. \"you make me pain\"",
   "Dai, vieni qua, mi fai pena.", "Come on, come here, I feel bad for you.", "Can sound harsh; often affectionate."],
  ["Parlato", "Non… manco", "not even", "",
   "Non hai mangiato manco ieri.", "You didn't even eat yesterday.", "Colloquial for neanche / nemmeno."],
  ["Parlato", "La monnezza", "the trash", "",
   "Vado a buttare la monnezza.", "I'm going to take out the trash.", "Roman / southern for la spazzatura."],

  ["Volgare", "Che palle!", "what a drag! / how annoying!", "lit. \"what balls!\"",
   "Che palle! Finisce subito!", "What a drag, it's over so fast!", "Mild and extremely common among friends."],
  ["Volgare", "Una donna con le palle", "a woman with guts", "lit. \"a woman with balls\"",
   "È quella donna con le palle, ambiziosa.", "She's that gutsy, ambitious woman.", "It's a compliment."],
  ["Volgare", "Cagarsi sotto", "to be scared to death", "lit. \"to crap yourself\"",
   "Mi sto cagando sotto!", "I'm scared out of my mind!", "Crude — friends only."],
  ["Volgare", "Prendere per il culo", "to make a fool of someone", "lit. \"to take by the ass\"",
   "A me non mi prende per il culo.", "Nobody makes a fool of me.", "The crude version of prendere in giro."],
  ["Volgare", "Marciarci", "to milk a situation, to play it up", "lit. \"to march on it\"",
   "Ci stai marciando!", "You're milking it!", "On the show it's only half-heard (\"stiamo marciando\")."]
];

const CATS = ["Tutte", "Sentimenti", "Atteggiamento", "Parlato", "Volgare"];
let cat = "Tutte", order = [], pos = 0, enFirst = false;
const $ = id => document.getElementById(id);

function build() {
  order = cards.map((_, i) => i).filter(i => cat === "Tutte" || cards[i][0] === cat);
  pos = 0; render();
}
function render() {
  const [c, expr, meaning, literal, ex, exen, note] = cards[order[pos]];
  $("card").classList.remove("flipped");
  $("tagF").textContent = $("tagB").textContent = c;
  $("tagF").className = $("tagB").className = "tag" + (c === "Volgare" ? " vulg" : "");
  if (enFirst) {
    $("expr").textContent = meaning;
    $("hint").textContent = "come si dice in italiano?";
    $("meaning").textContent = expr;
  } else {
    $("expr").textContent = expr;
    $("hint").textContent = "cosa vuol dire?";
    $("meaning").textContent = meaning;
  }
  $("literal").textContent = literal;
  $("ex").textContent = ex;
  $("exen").textContent = exen;
  $("note").textContent = note || "";
  $("count").textContent = (pos + 1) + " / " + order.length;
}

CATS.forEach(c => {
  const b = document.createElement("button");
  b.className = "chip" + (c === cat ? " on" : "");
  b.textContent = c;
  b.onclick = () => {
    cat = c;
    document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
    build();
  };
  $("chips").appendChild(b);
});

let itVoice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^it[-_]/i.test(v.lang));
  itVoice = vs.find(v => /enhanced|premium/i.test(v.name)) || vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(e) {
  if (e) e.stopPropagation();
  if (!("speechSynthesis" in window)) return;
  const [, expr, , , ex] = cards[order[pos]];
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(expr.replace(/[(/…)]/g, " ") + ". " + ex.replace(/[—]/g, ""));
  u.lang = "it-IT"; if (itVoice) u.voice = itVoice; u.rate = 0.9;
  speechSynthesis.speak(u);
}

$("scene").onclick = () => $("card").classList.toggle("flipped");
$("flip").onclick = () => $("card").classList.toggle("flipped");
$("next").onclick = () => { pos = (pos + 1) % order.length; render(); };
$("prev").onclick = () => { pos = (pos - 1 + order.length) % order.length; render(); };
$("shuffle").onclick = () => {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0; render();
};
$("speak").onclick = speak;
$("dir").onclick = () => { enFirst = !enFirst; $("dir").textContent = enFirst ? "EN → IT" : "IT → EN"; render(); };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === " ") { e.preventDefault(); $("flip").click(); }
});
build();
</script>
</body>
</html>
