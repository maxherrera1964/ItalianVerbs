<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1216">
<title>Pronomi Combinati — Italian Quiz</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0f1216; --panel:#181d24; --panel2:#212832; --line:#2c343f;
    --txt:#eef2f6; --dim:#93a1b1; --accent:#4ade80; --accent2:#38bdf8;
    --red:#f87171; --amber:#fbbf24; --violet:#c4b5fd;
  }
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;
    display:flex; flex-direction:column; overscroll-behavior:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select:none; user-select:none;
  }
  header{display:flex;align-items:center;gap:7px;padding:12px 14px 8px}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.3px;flex:1}
  header h1 span{color:var(--accent)}
  .btn{
    background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:8px 11px; font-size:13px; font-weight:600; cursor:pointer;
    white-space:nowrap; font-family:inherit;
  }
  .btn:active{transform:scale(.96)}
  .btn.on{background:var(--accent);color:#06210f;border-color:var(--accent)}

  .bar{height:4px;background:var(--panel2);margin:4px 16px 0;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .meta{display:flex;justify-content:space-between;padding:8px 16px;font-size:12px;color:var(--dim);gap:10px}
  .meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px;overflow-y:auto}
  .card{
    width:100%; max-width:520px; min-height:40vh; margin:auto;
    background:linear-gradient(160deg,var(--panel),var(--panel2));
    border:1px solid var(--line); border-radius:22px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px 20px 26px; position:relative;
  }
  .card.tappable{cursor:pointer}
  .tag{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--dim);
    white-space:nowrap; max-width:92%; overflow:hidden; text-overflow:ellipsis;
  }
  .prompt{font-size:15px;color:var(--accent2);margin-bottom:6px;font-weight:600}
  .big{font-size:clamp(24px,7vw,38px);font-weight:700;line-height:1.25;margin:6px 0}
  .big.sm{font-size:clamp(18px,5vw,26px)}
  .big.xs{font-size:clamp(16px,4.3vw,21px);line-height:1.4}
  .gloss{font-size:15px;color:var(--violet);margin-top:6px;font-weight:600;line-height:1.45}
  .sub{font-size:15px;color:var(--dim);margin-top:10px;line-height:1.5}
  .hint{position:absolute;bottom:14px;font-size:11px;color:#5d6b7a;letter-spacing:.5px}
  .answer{display:none;width:100%}
  .card.flipped .answer{display:block}
  .card.flipped .hint{display:none}
  .pron{font-size:13px;color:var(--dim);margin:14px auto 0;line-height:1.55;max-width:420px}
  .pron b{color:var(--txt)}
  .ex{margin:14px auto 0;padding:12px 14px;border-radius:12px;background:#12181e;border:1px solid var(--line);max-width:420px}
  .exit{font-size:16px;font-weight:600;line-height:1.4}
  .exen{font-size:13px;color:var(--dim);margin-top:5px}
  .spkrow{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .spk{
    background:var(--panel2);color:var(--accent2);border:1px solid var(--line);
    border-radius:99px;padding:9px 16px;font-size:14px;font-weight:650;cursor:pointer;font-family:inherit;
  }
  .spk.alt{color:var(--dim);font-weight:500}
  .spk:active{transform:scale(.95)}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    padding:4px 9px;border-radius:99px;margin:0 4px 8px;background:#33260f;color:var(--amber)}

  /* derivation strip: indirect + direct = combined */
  .der{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px auto 0;max-width:420px}
  .der .pill{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center;min-width:78px}
  .der .pill small{display:block;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  .der .pill b{font-size:17px}
  .der .pill.ind b{color:var(--accent2)}
  .der .pill.dir b{color:var(--red)}
  .der .pill.out{background:#12301f;border-color:var(--accent)}
  .der .pill.out b{color:var(--accent)}
  .der .op{font-size:18px;color:var(--dim);font-weight:700}

  footer{padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
  .rate{display:flex;gap:10px}
  .rate button{flex:1;padding:15px 0;border-radius:14px;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .again{background:#3a2226;color:var(--red)}
  .good{background:#12301f;color:var(--accent)}
  .rate button:active{transform:scale(.97)}
  .single{width:100%;padding:15px 0;border-radius:14px;border:none;font-size:15px;font-weight:700;
    background:var(--panel2);color:var(--txt);cursor:pointer;font-family:inherit}

  .opts{display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto}
  .opt{
    width:100%;text-align:left;padding:13px 14px;border-radius:12px;
    background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;line-height:1.35;
    display:flex;gap:10px;align-items:baseline;
  }
  .opt i{font-style:normal;color:var(--dim);font-size:12px;font-weight:700;min-width:12px}
  .opt:active{transform:scale(.99)}
  .opt.right{background:#12301f;border-color:var(--accent);color:var(--accent)}
  .opt.right i{color:var(--accent)}
  .opt.wrong{background:#3a2226;border-color:var(--red);color:var(--red)}
  .opt.wrong i{color:var(--red)}
  .opt.mute{opacity:.45}
  .opt[disabled]{cursor:default}

  .typerow{display:flex;gap:8px}
  .tin{
    flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:12px;padding:14px;font-size:17px;font-family:inherit;font-weight:600;
    -webkit-user-select:text;user-select:text;
  }
  .tin::placeholder{color:#5d6b7a;font-weight:400}
  .tin.ok{border-color:var(--accent);color:var(--accent)}
  .tin.no{border-color:var(--red);color:var(--red)}
  .accrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .acc{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;
    padding:8px 12px;font-size:16px;cursor:pointer;font-family:inherit}
  .acc:active{transform:scale(.95)}

  /* sheets */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10;align-items:flex-end}
  .sheet.open{display:flex}
  .sheetbox{
    background:var(--panel);width:100%;max-height:88vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .sheetbox h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin:18px 0 10px}
  .sheetbox h2:first-child{margin-top:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    padding:8px 12px;border-radius:99px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .chip.sel{background:var(--accent);color:#06210f;border-color:var(--accent);font-weight:650}
  .chip .n{opacity:.7;font-size:11px;margin-left:5px}
  .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .row .btn{flex:1;text-align:center}
  .addhint{font-size:12px;color:var(--dim);margin-top:9px;line-height:1.55}
  .addhint b{color:var(--txt)}
  .stat{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
  .close{width:100%;margin-top:22px;padding:14px;border-radius:14px;border:none;
    background:var(--accent);color:#06210f;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
  .danger{background:transparent;color:var(--red);border:1px solid #4a2a2e}
  .picker{flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:10px;padding:11px;font-size:15px;font-weight:650;text-align:center;cursor:pointer;font-family:inherit}

  /* reference */
  .sheet.full{align-items:stretch}
  .sheet.full .sheetbox{border-radius:0;max-height:100vh;height:100%;padding-top:calc(14px + env(safe-area-inset-top))}
  .studyhead{display:flex;align-items:center;gap:8px;position:sticky;top:0;
    background:var(--panel);padding-bottom:10px;margin-bottom:4px;z-index:2}
  .studyhead b{flex:1;font-size:16px}
  .grid{width:100%;border-collapse:collapse;font-size:15px;margin-top:2px}
  .grid th,.grid td{padding:9px 6px;text-align:center;border-top:1px solid var(--line)}
  .grid thead th{background:var(--panel2);font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--red);border-top:none}
  .grid tbody th{text-align:left;font-size:13px;color:var(--accent2);font-weight:650;padding-left:12px;white-space:nowrap}
  .grid td{font-weight:650;cursor:pointer}
  .grid td:active{background:#1c2430}
  .grid tbody tr:nth-child(even){background:rgba(255,255,255,.02)}
  .grid .glie{color:var(--violet)}
  .wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
  .wrap h3{margin:0;padding:10px 14px;background:var(--panel2);font-size:12px;
    text-transform:uppercase;letter-spacing:1.1px;color:var(--accent2)}
  .plain{font-size:13.5px;color:var(--dim);padding:11px 14px;border-top:1px solid var(--line);line-height:1.6}
  .plain b{color:var(--txt)}
  .plain i{color:var(--accent2);font-style:italic}
  .note{font-size:12.5px;color:var(--amber);padding:11px 14px;border-top:1px solid var(--line);background:#1d1a12;line-height:1.6}
  .r{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
  .r:active{background:#1c2430}
  .r .p{width:120px;flex:none;font-size:14px;font-weight:650}
  .r .f{flex:1;font-size:13.5px;color:var(--dim)}
  .r .x{font-size:13.5px;color:var(--accent2);font-style:italic;text-align:right;max-width:45%}
  .studypad{padding-bottom:24px}
</style>
</head>
<body>

<header>
  <h1>Pronomi <span>combinati</span></h1>
  <button class="btn" id="studyBtn">Study</button>
  <button class="btn" id="modeBtn">Choice</button>
  <button class="btn" id="setBtn">Deck</button>
</header>
<div class="bar"><i id="barFill"></i></div>
<div class="meta"><span id="counter">—</span><span id="score">—</span></div>

<main>
  <div class="card" id="card">
    <div class="tag" id="tag"></div>
    <div id="front"></div>
    <div class="answer" id="back"></div>
    <div class="hint" id="hint"></div>
  </div>
</main>

<footer><div id="controls"></div></footer>

<div class="sheet full" id="studySheet">
  <div class="sheetbox">
    <div class="studyhead">
      <b id="studyTitle">Reference</b>
      <button class="btn on" id="tabTable">Table</button>
      <button class="btn" id="tabRules">Rules</button>
      <button class="btn" id="tabIdioms">Idioms</button>
      <button class="btn" id="studyClose">Done</button>
    </div>
    <div class="studypad" id="studyBody"></div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheetbox">
    <h2>Test mode</h2>
    <div class="chips" id="modeChips"></div>
    <div class="addhint" id="modeHint"></div>

    <h2>What to drill</h2>
    <div class="chips" id="catChips"></div>
    <div class="row">
      <button class="btn" id="allC">All</button>
      <button class="btn" id="noneC">Clear</button>
    </div>
    <div class="row">
      <button class="btn" id="tableC">Table only</button>
      <button class="btn" id="senC">Sentences</button>
      <button class="btn" id="idiC">Idioms</button>
    </div>
    <div class="addhint"><b>Table only</b> drills the thirty combinations both ways — mi + lo → me lo, and gliene
      back into its two halves. <b>Sentences</b> is where the choice actually has to be made from context.</div>

    <h2>Order</h2>
    <div class="chips" id="ordChips"></div>

    <h2>Audio — Italian voice</h2>
    <select id="voiceSel" class="picker" style="width:100%"></select>
    <div class="row">
      <button class="btn" id="autoSpk">Speak answer on reveal</button>
      <button class="btn" id="testSpk">▶ Test</button>
    </div>
    <div class="stat" id="voiceStat"></div>

    <h2>Progress</h2>
    <div class="stat" id="progStat"></div>
    <div class="row">
      <button class="btn" id="resetKnownBtn">Reset known cards</button>
      <button class="btn danger" id="resetBtn">Reset progress</button>
    </div>
    <button class="close" id="closeBtn">Start studying</button>
  </div>
</div>

<script>
/* =======================================================================
   COMBINED PRONOUNS — data
   Indirect + direct, in that order, before the verb:
       INDIRECT + DIRECT/NE + VERB
   mi, ti, ci, vi change their -i to -e; gli and le both become glie- and
   are written joined to the direct pronoun.
   ======================================================================= */
const IND = [
  {p:"mi",      comb:"me",   it:"a me",        en:"a me (to me)"},
  {p:"ti",      comb:"te",   it:"a te",        en:"a te (to you)"},
  {p:"gli / le",comb:"glie", it:"a lui, a lei",en:"a lui, a lei (to him, to her)"},
  {p:"ci",      comb:"ce",   it:"a noi",       en:"a noi (to us)"},
  {p:"vi",      comb:"ve",   it:"a voi",       en:"a voi (to you, plural)"},
  {p:"gli",     comb:"glie", it:"a loro",      en:"a loro (to them)", dup:true}
];
const DIR = [
  {p:"lo", en:"it (m. sing.)"},
  {p:"la", en:"it (f. sing.)"},
  {p:"li", en:"them (m. pl.)"},
  {p:"le", en:"them (f. pl.)"},
  {p:"ne", en:"of it, of them"}
];
const join = (comb, dir) => comb==="glie" ? comb+dir : comb+" "+dir;

const CATS = [
  {id:"tabella",   label:"The table",     it:"La tabella — mi + lo → me lo"},
  {id:"scomporre", label:"Take apart",    it:"Scomporre — glielo → gli + lo"},
  {id:"regole",    label:"Rules",         it:"Le regole"},
  {id:"frasi",     label:"Sentences",     it:"Scegli il pronome giusto"},
  {id:"riscrivere",label:"Rewrite",       it:"Riscrivi con i pronomi combinati"},
  {id:"posizione", label:"Position",      it:"Dove vanno i pronomi"},
  {id:"accordo",   label:"Agreement",     it:"L'accordo del participio"},
  {id:"idiomi",    label:"Idioms",        it:"Espressioni idiomatiche"}
];
const CARDS = [];
const add = c => { CARDS.push(c); return c; };

/* ---- 1. the thirty combinations, both directions ---- */
IND.forEach(i=> DIR.forEach(d=>{
  const out = join(i.comb, d.p);
  const shownInd = i.dup ? "gli (a loro)" : i.p;
  add({cat:"tabella", fam:"comb", q:shownInd+" + "+d.p, sub:i.en+"  +  "+d.en, qs:"combine them",
    a:out, der:[shownInd, d.p, out],
    note:(i.comb==="glie"
      ? "Gli and le both become glie-, and the two pronouns are written as one word: "+out+", never ✗ gli "+d.p+"."
      : "The -i of "+i.p+" becomes -e before another pronoun: "+i.p+" → "+i.comb+".")});
  if(!i.dup) add({cat:"scomporre", fam:"split", q:out, qs:"which two pronouns make this up?",
    a:i.p+" + "+d.p, der:[i.p, d.p, out], sub:"",
    note:i.en+"  +  "+d.en+". The indirect pronoun always comes first."});
}));

/* ---- 2. rules ---- */
add({cat:"regole", fam:"rule", q:"two pronouns together", qs:"which order?",
  a:"indirect + direct + verb",
  opts:["indirect + direct + verb","direct + indirect + verb","verb + indirect + direct","either order"],
  note:"Mi + lo → Me lo dai? · Ti + la → Te la presto. · Gli + li → Glieli porto. The indirect says TO WHOM, the direct says WHAT."});
add({cat:"regole", fam:"rule", q:"mi, ti, ci, vi", qs:"what happens before another pronoun?",
  a:"the -i becomes -e: me, te, ce, ve",
  opts:["the -i becomes -e: me, te, ce, ve","they stay unchanged","they become glie-","they move after the verb"],
  note:"mi → me · ti → te · ci → ce · vi → ve. Only gli and le behave differently."});
add({cat:"regole", fam:"rule", q:"gli and le", qs:"what do they become?",
  a:"both become glie- and join the direct pronoun",
  opts:["both become glie- and join the direct pronoun","they become gle- and stay separate","gli stays, le becomes ge-","they drop out"],
  note:"glielo, gliela, glieli, gliele, gliene — one word, always. Both a lui and a lei give the same glie- form, so only context tells you which."});
add({cat:"regole", fam:"rule", q:"glielo", qs:"one word or two?",
  a:"always one word — glielo",
  opts:["always one word — glielo","two words — gli lo","two words with an apostrophe — gli'lo","either spelling"],
  note:"The glie- forms are the only combined pronouns written joined. Me lo, te la, ce li, ve ne all stay as two words."});
add({cat:"regole", fam:"rule", q:"a loro", qs:"what does modern Italian use?",
  a:"gli — so glielo dico ai ragazzi",
  opts:["gli — so glielo dico ai ragazzi","loro after the verb, always","ve-","ce-"],
  note:"Gli covers a lui, a lei and a loro alike. The older form with loro after the verb — lo dico loro — is now rare and very formal."});
add({cat:"regole", fam:"rule", q:"the direct pronoun", qs:"what does it tell you?",
  a:"WHAT — lo, la, li, le, or ne",
  opts:["WHAT — lo, la, li, le, or ne","TO WHOM — mi, ti, gli, ci, vi","when the action happened","which tense to use"],
  note:"And the indirect pronoun (mi, ti, gli/le, ci, vi) tells you TO WHOM. Identify those two and the combination follows from the table."});
add({cat:"regole", fam:"rule", q:"ne", qs:"what does it stand in for?",
  a:"of it, of them — a quantity or a topic",
  opts:["of it, of them — a quantity or a topic","a feminine plural object","an indirect person","a place"],
  note:"Me ne dai un po'? (di pane) · Gliene ho parlato. (di questo) · Ce ne sono molti. It combines with every indirect pronoun: me ne, te ne, gliene, ce ne, ve ne."});
add({cat:"regole", fam:"rule", q:"me lo + ho", qs:"can it elide?",
  a:"yes — me l'ho, and it usually does in speech",
  opts:["yes — me l'ho, and it usually does in speech","no, never","only in writing","only with li and le"],
  note:"Elision happens only with lo and la: me l'ho, te l'ho, gliel'ho. Li, le and ne never elide — ✗ me l'hanno dati is wrong for me li hanno dati. The elision is optional but very common."});
add({cat:"regole", fam:"rule", q:"Te l'ho detto / detta", qs:"what decides the ending?",
  a:"the direct pronoun: lo → -o, la → -a, li → -i, le → -e",
  opts:["the direct pronoun: lo → -o, la → -a, li → -i, le → -e","the subject","the auxiliary","nothing — it never changes"],
  note:"With combined pronouns the participle ALWAYS agrees with the direct pronoun. Te l'ho detto (il segreto) · Te l'ho detta (la verità) · Glieli ho dati (i libri) · Gliele ho date (le chiavi)."});
add({cat:"regole", fam:"rule", q:"Me ne ha dati tre.", qs:"what does the participle agree with here?",
  a:"the quantity ne refers to",
  opts:["the quantity ne refers to","the subject","nothing","the indirect pronoun"],
  note:"Ne takes its agreement from the noun behind it: Me ne ha dati tre (libri, masculine plural) · Me ne hanno dati pochi (di soldi)."});

/* ---- 3. sentence completion ---- */
[["Hai dato il libro a Marco? — Sì, ___ ho dato ieri.","glielo","a Marco = gli · il libro = lo"],
 ["Mi presti la penna? — Certo, ___ presto subito.","te la","a te = ti → te · la penna = la"],
 ["Avete spiegato la situazione ai vostri genitori? — No, non ___ abbiamo ancora spiegata.","gliela","ai genitori = gli · la situazione = la"],
 ["Chi ti ha regalato questi fiori? — ___ ha regalati Marco.","me li","a me = mi → me · questi fiori = li"],
 ["Hai parlato del problema a Sara? — Sì, ___ ho parlato.","gliene","a Sara = le → glie- · del problema = ne"],
 ["___ compri? (Compri il gelato a me?)","me lo","a me = me · il gelato = lo"],
 ["___ presti? (Presti la macchina a me?)","me la","a me = me · la macchina = la"],
 ["___ dai? (Dai i soldi a me?)","me li","a me = me · i soldi = li"],
 ["___ porti? (Porti le chiavi a me?)","me le","a me = me · le chiavi = le"],
 ["___ dai un po'? (Dai un po' di pane a me?)","me ne","a me = me · di pane = ne"],
 ["___ spiego subito. (Spiego il problema a te)","te lo","a te = te · il problema = lo"],
 ["___ mando per email. (Mando la foto a te)","te la","a te = te · la foto = la"],
 ["___ ho già dati. (Ho dato i libri a te)","te li","a te = te · i libri = li"],
 ["___ regalo. (Regalo le rose a te)","te le","a te = te · le rose = le"],
 ["___ parlo domani. (Parlo di questo a te)","te ne","a te = te · di questo = ne"],

const MODES = [
  {id:"choice", label:"Choice", hint:"The Italian on the card, four answers underneath — tap one or press 1–4. Graded for you."},
  {id:"type",   label:"Type",   hint:"Type the answer yourself, accents and apostrophes included. Meaning and rule cards stay multiple choice."},
  {id:"recall", label:"Recall", hint:"Say the answer out loud, reveal it, then rate yourself Again or Got it."}
];
const catLabel = id => (CATS.find(c=>c.id===id)||{}).label || id;

const KEY = "pronomicombinati_v1";
let S = {
  ver:1, mode:"choice", cats:CATS.map(c=>c.id), order:"section",
  speak:false, voiceName:"", stats:{}, known:{}, seen:0, right:0
};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };

let deck=[], pos=0, flipped=false, answered=false;
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const cid = c => c.cat+"|"+c.q+"|"+c.qs;
const low = s => String(s).toLowerCase();
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function pool(){ return CARDS.filter(c=>S.cats.includes(c.cat)); }
function buildDeck(){
  let list = pool().filter(c=>!S.known[cid(c)]);
  if(S.order==="random") shuffle(list);
  else{
    const ord = CATS.map(c=>c.id);
    list.sort((a,b)=> ord.indexOf(a.cat)-ord.indexOf(b.cat) || CARDS.indexOf(a)-CARDS.indexOf(b));
  }
  deck=list; pos=0; render();
}

/* Distractors come from the same family, compared case-insensitively so that
   "Me li" and "me li" can never appear as two separate options. */
function optionsFor(c){
  if(c.opts && c.opts.length){
    const list=c.opts.slice();
    if(!list.includes(c.a)) list.push(c.a);
    return {correct:c.a, list:list.length>2 ? shuffle(list) : list};
  }
  const ok = x => x!==c && x.fam===c.fam && low(x.a)!==low(c.a);
  const same = shuffle(CARDS.filter(ok));
  const rest = shuffle(CARDS.filter(x=>x!==c && !x.opts && low(x.a)!==low(c.a)));
  const picks=[];
  const push = x => { if(picks.length<3 && !picks.some(p=>low(p.a)===low(x.a))) picks.push(x); };
  same.forEach(push); rest.forEach(push);
  return {correct:c.a, list:shuffle(picks.map(x=>x.a).concat(c.a))};
}

const typable = c => !c.opts && !c.noType;
const norm  = s => String(s||"").toLowerCase().trim().replace(/[.!?]+$/,"").replace(/\s+/g," ").replace(/[’']/g,"'");
const strip = s => norm(s).replace(/[àá]/g,"a").replace(/[èé]/g,"e").replace(/[ìí]/g,"i").replace(/[òó]/g,"o").replace(/[ùú]/g,"u");
const answersFor = c => [c.a].concat(c.alt||[]);

/* ---------------- RENDER ---------------- */
function derStrip(d){
  if(!d) return "";
  return '<div class="der">'+
    '<div class="pill ind"><small>indirect</small><b>'+esc(d[0])+'</b></div><span class="op">+</span>'+
    '<div class="pill dir"><small>direct</small><b>'+esc(d[1])+'</b></div><span class="op">=</span>'+
    '<div class="pill out"><small>combined</small><b>'+esc(d[2])+'</b></div></div>';
}
function backHTML(c){
  return '<div class="big'+(c.a.length>26?" xs":(c.a.length>16?" sm":""))+'" style="color:var(--accent)">'+esc(c.a)+'</div>'+
    (c.fam==="idi" ? '<div class="sub">'+esc(c.q)+'</div>' : "")+
    derStrip(c.der)+
    (c.ex ? '<div class="ex"><div class="exit">'+esc(c.ex)+'</div>'+(c.exen?'<div class="exen">'+esc(c.exen)+'</div>':'')+'</div>' : "")+
    '<div class="spkrow"><button class="spk" id="spkBtn">🔊 ascolta</button></div>'+
    (c.note ? '<div class="pron">'+esc(c.note)+'</div>' : "");
}
function render(){
  const card=$("card");
  card.classList.remove("flipped"); flipped=false; answered=false;
  card.classList.toggle("tappable", S.mode==="recall");
  $("hint").textContent = S.mode==="recall" ? "tap to reveal" : "";

  if(!deck.length){
    $("tag").textContent="";
    $("front").innerHTML='<div class="big">All done! ✓</div><div class="sub">Every selected card is retired as known, or nothing is selected. Open “Deck” to reset known cards or pick more sections.</div>';
    $("back").innerHTML=""; $("controls").innerHTML="";
    $("counter").textContent="—"; $("score").textContent="—"; $("barFill").style.width="0";
    return;
  }
  if(pos>=deck.length){ buildDeck(); return; }

  const c=deck[pos];
  $("tag").textContent = catLabel(c.cat).toUpperCase();
  $("front").innerHTML = '<div class="prompt">'+esc(c.qs)+'</div>'+
    '<div class="big'+(c.q.length>34?" xs":(c.q.length>20?" sm":""))+'">'+esc(c.q)+'</div>'+
    (c.sub ? '<div class="gloss">'+esc(c.sub)+'</div>' : "");
  $("back").innerHTML = backHTML(c);

  if(S.mode==="recall"){
    $("controls").innerHTML = '<button class="single" id="revealBtn">Reveal</button>';
    $("revealBtn").onclick = flip;
  }else if(S.mode==="type" && typable(c)){
    $("controls").innerHTML =
      '<div class="typerow"><input class="tin" id="typeIn" placeholder="type the answer…" '+
      'autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">'+
      '<button class="btn" id="checkBtn" style="padding:0 18px">Check</button></div>'+
      '<div class="accrow">'+["à","è","é","ì","ò","ù","'"].map(a=>'<button class="acc" data-a="'+a+'">'+a+'</button>').join("")+'</div>';
    const inp=$("typeIn");
    $("checkBtn").onclick = ()=>checkTyped(inp,c);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); checkTyped(inp,c); } });
    $("controls").querySelectorAll(".acc").forEach(b=> b.onclick = ()=>{
      const s=inp.selectionStart||inp.value.length;
      inp.value = inp.value.slice(0,s)+b.dataset.a+inp.value.slice(inp.selectionEnd||s);
      inp.focus(); inp.setSelectionRange(s+1,s+1);
    });
    setTimeout(()=>inp.focus(),0);
  }else{
    const o=optionsFor(c);
    $("controls").innerHTML = '<div class="opts">'+o.list.map((t,i)=>
      '<button class="opt" data-v="'+esc(t)+'"><i>'+(i+1)+'</i><span>'+esc(t)+'</span></button>').join("")+'</div>';
    $("controls").querySelectorAll(".opt").forEach(b=> b.onclick = ()=>choose(b,o.correct));
  }

  const st=S.stats[cid(c)];
  $("counter").textContent = (pos+1)+" / "+deck.length + (st ? "  ·  ✓"+st.r+" ✗"+st.w : "");
  const pct = S.seen ? Math.round(S.right/S.seen*100) : 0;
  $("score").textContent = S.seen ? pct+"% correct ("+S.seen+" answered)" : "no answers yet";
  $("barFill").style.width = (pos/deck.length*100)+"%";
}

function sayFor(c){
  if(c.ex) return c.ex;
  if(c.fam==="sent") return c.q.replace("___", c.a).split("(")[0];
  if(c.fam==="agr")  return c.q.replace(/\(.*?\)\s*___/, c.a).split("?").join("? ");
  if(c.fam==="idi")  return c.q;
  return c.a;
}
function wireSpeak(){
  const c=deck[pos]; if(!c) return;
  const b=$("spkBtn");
  if(b) b.onclick = e=>{ e.stopPropagation(); speak(sayFor(c)); };
  if(S.speak) speak(sayFor(c), true);
}
function reveal(){
  flipped=true; $("card").classList.add("flipped"); wireSpeak();
  const m=document.querySelector("main");
  setTimeout(()=>{ if(m.scrollHeight>m.clientHeight) m.scrollTop=m.scrollHeight; },0);
}
function flip(){
  if(!deck.length || flipped) return;
  reveal();
  $("controls").innerHTML = '<div class="rate"><button class="again" id="againBtn">Again</button>'+
                            '<button class="good" id="goodBtn">Got it</button></div>';
  $("againBtn").onclick = ()=>rate(false);
  $("goodBtn").onclick  = ()=>rate(true);
}
function nextButton(label, ok){
  const n=document.createElement("button");
  n.className="single"; n.style.marginTop="10px"; n.textContent=label;
  n.onclick=()=>rate(ok);
  $("controls").appendChild(n); n.focus();
}
function choose(btn, correct){
  if(answered) return; answered=true;
  const ok = btn.dataset.v===correct;
  $("controls").querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(b.dataset.v===correct) b.classList.add("right");
    else if(b===btn) b.classList.add("wrong");
    else b.classList.add("mute");
  });
  reveal();
  nextButton(ok ? "Correct ✓ — next" : "Next", ok);
}
function checkTyped(inp, c){
  if(answered) return;
  const got=norm(inp.value); if(!got) return;
  const answers=answersFor(c);
  const exact = answers.some(a=>norm(a)===got);
  const loose = answers.some(a=>strip(a)===strip(got) || strip(a).replace(/'/g,"")===strip(got).replace(/'/g,""));
  answered=true; inp.disabled=true;
  inp.classList.add(exact?"ok":"no");
  reveal();
  if(!exact && loose){
    const b=document.createElement("div");
    b.className="badge"; b.textContent="right words, check accents and apostrophes";
    $("back").prepend(b);
  }
  nextButton(exact ? "Correct ✓ — next" : (loose ? "Almost — next" : "Next"), exact);
}
function rate(ok){
  const c=deck[pos], id=cid(c);
  const st=S.stats[id]||{r:0,w:0};
  ok ? st.r++ : st.w++;
  S.stats[id]=st;
  if(ok) S.known[id]=true;
  S.seen++; if(ok) S.right++;
  if(!ok){ const at=Math.min(pos+6, deck.length); deck.splice(at,0,c); }
  save(); pos++; render();
}
$("card").onclick = ()=>{ if(S.mode==="recall" && !flipped) flip(); };

document.addEventListener("keydown", e=>{
  if($("sheet").classList.contains("open") || $("studySheet").classList.contains("open")) return;
  const typing = document.activeElement && document.activeElement.id==="typeIn";
  if((e.key===" "||e.key==="Enter") && !typing){
    e.preventDefault();
    if(S.mode==="recall" && !flipped) return flip();
    const n=$("controls").querySelector(".single"); if(n) n.click();
    return;
  }
  if(!typing && /^[1-4]$/.test(e.key)){
    const b=$("controls").querySelectorAll(".opt")[+e.key-1]; if(b && !b.disabled) b.click();
  }
  if(!typing && flipped && S.mode==="recall"){
    if(e.key==="a"||e.key==="A") rate(false);
    if(e.key==="g"||e.key==="G") rate(true);
  }
});

/* ---------------- AUDIO ---------------- */
let itVoices=[], itVoice=null;
function rankVoice(v){
  const n=(v.name||"").toLowerCase(); let s=0;
  if(/premium|enhanced|siri|neural/.test(n)) s+=40;
  if(/alice|federica|luca|emma|paola|eloisa|carlo/.test(n)) s+=20;
  if(v.localService) s+=10;
  if(/^it[-_]IT$/i.test(v.lang)) s+=10;
  return s;
}
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  itVoices = speechSynthesis.getVoices().filter(v=>/^it\b|^it[-_]/i.test(v.lang)).sort((a,b)=>rankVoice(b)-rankVoice(a));
  itVoice = itVoices.find(v=>v.name===S.voiceName) || itVoices[0] || null;
}
let voiceTries=0;
function refreshVoices(){
  try{ const had=itVoices.length; pickVoice(); if(itVoices.length!==had && $("voiceSel")) drawVoices(); }catch(e){}
  return itVoices.length;
}
function pollVoices(){ if(refreshVoices() || ++voiceTries>40) return; setTimeout(pollVoices,250); }
if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = ()=>{ voiceTries=0; refreshVoices(); };
  setTimeout(pollVoices,0);
  ["touchend","click","keydown"].forEach(ev=>
    document.addEventListener(ev, ()=>{ voiceTries=0; pollVoices(); }, {passive:true, once:true}));
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) refreshVoices(); });
}
function speak(text, quiet){
  if(!("speechSynthesis" in window)) return;
  if(!itVoice) pickVoice();
  if(!itVoice){
    if(quiet) return;
    alert("No Italian voice has been detected yet.\n\n"+
          "The voice list sometimes loads a moment late — tap this again in a few seconds.\n\n"+
          "If it stays silent, add an Italian voice:\n"+
          "iPhone / iPad: Settings › Accessibility › Spoken Content › Voices › Italian\n"+
          "Mac: System Settings › Accessibility › Spoken Content › System Voice › Manage Voices…\n\n"+
          "An English voice reading Italian sounds wrong, so audio stays off until one is available.");
    return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text).replace(/___/g,"…").replace(/\s*—\s*to\s.*$/,""));
  u.voice=itVoice; u.lang=itVoice.lang||"it-IT"; u.rate=0.92; u.pitch=1;
  speechSynthesis.speak(u);
}
function drawVoices(){
  const sel=$("voiceSel"); if(!sel) return;
  sel.innerHTML = itVoices.length
    ? itVoices.map(v=>'<option value="'+esc(v.name)+'"'+(itVoice&&v.name===itVoice.name?" selected":"")+'>'+esc(v.name)+' — '+esc(v.lang)+'</option>').join("")
    : '<option>No Italian voice found on this device</option>';
  $("voiceStat").textContent = itVoices.length
    ? itVoices.length+" Italian voice"+(itVoices.length>1?"s":"")+" available. Enhanced or Premium voices sound markedly better."
    : "Audio stays off until an Italian voice is installed — an English voice reading Italian sounds wrong.";
}
$("voiceSel").onchange = e=>{ S.voiceName=e.target.value; pickVoice(); save(); };
$("autoSpk").onclick = ()=>{ S.speak=!S.speak; save(); drawChips(); };
$("testSpk").onclick = ()=>{ speak("Glielo dico io. Me lo compri? Ce l'ho fatta!"); drawVoices(); };

/* ---------------- SETTINGS ---------------- */
const count = cat => CARDS.filter(c=>c.cat===cat).length;
function drawChips(){
  $("modeChips").innerHTML = MODES.map(m=>
    '<button class="chip'+(S.mode===m.id?" sel":"")+'" data-m="'+m.id+'">'+m.label+'</button>').join("");
  $("modeChips").querySelectorAll(".chip").forEach(b=> b.onclick = ()=>{
    S.mode=b.dataset.m; save(); drawChips(); syncModeBtn(); render();
  });
  $("modeHint").textContent = (MODES.find(m=>m.id===S.mode)||{}).hint || "";

  $("catChips").innerHTML = CATS.map(c=>
    '<button class="chip'+(S.cats.includes(c.id)?" sel":"")+'" data-c="'+c.id+'">'+c.label+
    '<span class="n">'+count(c.id)+'</span></button>').join("");
  $("catChips").querySelectorAll(".chip").forEach(b=> b.onclick = ()=>{
    const id=b.dataset.c;
    S.cats = S.cats.includes(id) ? S.cats.filter(x=>x!==id) : S.cats.concat(id);
    save(); drawChips(); buildDeck();
  });

  $("ordChips").innerHTML = [["section","By section"],["random","Shuffled"]].map(([id,l])=>
    '<button class="chip'+(S.order===id?" sel":"")+'" data-o="'+id+'">'+l+'</button>').join("");
  $("ordChips").querySelectorAll(".chip").forEach(b=> b.onclick = ()=>{ S.order=b.dataset.o; save(); drawChips(); buildDeck(); });

  $("autoSpk").classList.toggle("on", !!S.speak);
  const inPool=pool().length, known=pool().filter(c=>S.known[cid(c)]).length;
  $("progStat").textContent = known+" of "+inPool+" selected cards retired as known · "+
    S.seen+" answers, "+(S.seen?Math.round(S.right/S.seen*100):0)+"% correct.";
  drawVoices();
}
function syncModeBtn(){ $("modeBtn").textContent = (MODES.find(m=>m.id===S.mode)||MODES[0]).label; }

$("setBtn").onclick   = ()=>{ drawChips(); $("sheet").classList.add("open"); };
$("closeBtn").onclick = ()=>{ $("sheet").classList.remove("open"); buildDeck(); };
$("sheet").onclick    = e=>{ if(e.target===$("sheet")){ $("sheet").classList.remove("open"); buildDeck(); } };
$("allC").onclick   = ()=>{ S.cats=CATS.map(c=>c.id); save(); drawChips(); buildDeck(); };
$("noneC").onclick  = ()=>{ S.cats=[]; save(); drawChips(); buildDeck(); };
$("tableC").onclick = ()=>{ S.cats=["tabella","scomporre"]; save(); drawChips(); buildDeck(); };
$("senC").onclick   = ()=>{ S.cats=["frasi","riscrivere","accordo"]; save(); drawChips(); buildDeck(); };
$("idiC").onclick   = ()=>{ S.cats=["idiomi"]; save(); drawChips(); buildDeck(); };
$("resetKnownBtn").onclick = ()=>{ S.known={}; save(); drawChips(); buildDeck(); };
$("resetBtn").onclick = ()=>{
  if(!confirm("Reset all progress — known cards, per-card stats, and the score?")) return;
  S.known={}; S.stats={}; S.seen=0; S.right=0; save(); drawChips(); buildDeck();
};
$("modeBtn").onclick = ()=>{
  const i=MODES.findIndex(m=>m.id===S.mode);
  S.mode=MODES[(i+1)%MODES.length].id; save(); syncModeBtn(); render();
};

/* ---------------- REFERENCE ---------------- */
let studyTab="table";
function drawTable(){
  $("studyTitle").textContent="The table";
  const head = '<tr><th></th>'+DIR.map(d=>'<th>+ '+d.p+'</th>').join("")+'</tr>';
  const body = IND.map(i=>'<tr><th>'+i.p.toUpperCase()+'<br><span style="color:#6c7a89;font-weight:400;font-size:11px">'+
      esc(i.it)+'</span></th>'+
      DIR.map(d=>{ const f=join(i.comb,d.p);
        return '<td class="'+(i.comb==="glie"?"glie":"")+'" data-say="'+esc(f)+'">'+esc(f)+'</td>'; }).join("")+'</tr>').join("");
  $("studyBody").innerHTML =
    '<div class="wrap"><h3>All thirty combinations — tap any cell to hear it</h3>'+
      '<table class="grid"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>'+
      '<div class="plain"><b>The order never changes:</b> <i>INDIRECT + DIRECT/NE + VERB</i>. '+
        'The indirect pronoun answers TO WHOM, the direct pronoun answers WHAT.</div>'+
      '<div class="plain"><b>mi, ti, ci, vi</b> change their -i to -e: mi → me, ti → te, ci → ce, vi → ve.</div>'+
      '<div class="plain"><b>gli and le</b> both become <b>glie-</b> and are written joined to the direct pronoun: '+
        'glielo, gliela, glieli, gliele, gliene — never ✗ gli lo.</div>'+
      '<div class="note">Gli covers <b>a lui</b>, <b>a lei</b> and <b>a loro</b> alike, so the last row repeats the third: '+
        'Glielo dico a Marco · Glielo dico a Maria · Glielo dico ai ragazzi. The old form with loro after the verb '+
        '(lo dico loro) is now rare and very formal.</div>'+
    '</div>'+
    '<div class="wrap"><h3>Why they exist</h3>'+
      '<div class="r" data-say="Dai il libro a Marco?"><div class="p">Full sentence</div><div class="f">Dai il libro a Marco?</div></div>'+
      '<div class="r" data-say="Gli dai il libro?"><div class="p">One pronoun</div><div class="f">Gli dai il libro? (a Marco = gli)</div></div>'+
      '<div class="r" data-say="Glielo dai?"><div class="p">Both</div><div class="f">Glielo dai? (gli + lo)</div></div>'+
      '<div class="plain">Combined pronouns are constant in spoken Italian. Using them is most of what makes a sentence '+
        'sound native rather than translated.</div>'+
    '</div>';
  $("studyBody").querySelectorAll("[data-say]").forEach(el=> el.onclick=()=>speak(el.dataset.say));
}
function drawRules(){
  $("studyTitle").textContent="The rules";
  const ex = (it,gl)=> '<div class="r" data-say="'+esc(it)+'"><div class="p" style="width:auto;flex:1">'+esc(it)+
    '</div><div class="x">'+esc(gl)+'</div></div>';
  $("studyBody").innerHTML =
    '<div class="wrap"><h3>1 · Position — the general rule</h3>'+
      '<div class="plain">In every simple and compound tense of the indicative, subjunctive and conditional, the pronouns '+
        'go <b>before the verb</b> — and in compound tenses, before the auxiliary.</div>'+
      ex("Me lo dai?","presente")+ex("Te l'ho detto.","passato prossimo")+
      ex("Glielo darò domani.","futuro")+ex("Ce lo darebbe.","condizionale")+
    '</div>'+
    '<div class="wrap"><h3>2 · Attached to the end</h3>'+
      '<div class="plain">With an <b>infinitive</b> the pronouns attach to it, and the infinitive drops its final -e.</div>'+
      ex("Voglio dirtelo.","dire + te + lo")+ex("Devo spiegarglielo.","spiegare + glie + lo")+
      ex("È importante dirmela.","dire + me + la")+
      '<div class="plain">With <b>potere, volere, dovere, sapere</b> + infinitive, both positions are correct:</div>'+
      ex("Te lo posso dire. = Posso dirtelo.","")+ex("Glielo voglio regalare. = Voglio regalarglielo.","")+
      ex("Me la devi spiegare. = Devi spiegarmela.","")+ex("Ce lo sapete dire? = Sapete dircelo?","")+
    '</div>'+
    '<div class="wrap"><h3>3 · The imperative</h3>'+
      '<div class="plain"><b>Affirmative (tu, noi, voi):</b> after the verb, attached.</div>'+
      ex("Dimmelo!","Di' a me questo")+ex("Dagliela!","Da' a lui questa cosa")+ex("Portateceli!","Portate a noi questi")+
      '<div class="plain"><b>Negative:</b> before or after — both are correct.</div>'+
      ex("Non me lo dire! / Non dirmelo!","")+ex("Non glielo date! / Non dateglielo!","")+
      '<div class="plain"><b>Formal (Lei, Loro):</b> before the verb.</div>'+
      ex("Me lo dica, per favore!","")+ex("Glielo porti subito!","")+
      '<div class="note"><b>Consonant doubling.</b> After the short imperatives <b>da\', di\', fa\', sta\', va\'</b> the first '+
        'consonant of the pronoun doubles: da\' + me lo = <b>dammelo</b> · fa\' + ce la = <b>faccela</b>. '+
        'The exception is gli-, which never doubles: di\' + glielo = <b>diglielo</b>.</div>'+
    '</div>'+
    '<div class="wrap"><h3>4 · Agreement of the past participle</h3>'+
      '<div class="plain">With combined pronouns the participle <b>always</b> agrees with the direct pronoun: '+
        'lo → -o, la → -a, li → -i, le → -e, and ne agrees with the quantity behind it.</div>'+
      ex("Te l'ho detto.","il segreto → lo → -o")+ex("Te l'ho detta.","la verità → la → -a")+
      ex("Glieli ho dati.","i libri → li → -i")+ex("Gliele ho date.","le chiavi → le → -e")+
      ex("Me ne ha dati tre.","tre libri → -i")+
    '</div>'+
    '<div class="wrap"><h3>5 · Elision</h3>'+
      '<div class="plain">Only <b>lo</b> and <b>la</b> elide, and only before a vowel: me lo + ho → <b>me l\'ho</b> · '+
        'te la + ho → <b>te l\'ho</b> · glielo + ho → <b>gliel\'ho</b>. Optional, but very common in speech.</div>'+
      '<div class="note">Li, le and ne never elide: <b>me li hanno dati</b>, never ✗ me l\'hanno dati. And because '+
        'l\' hides which vowel was there, the participle is what tells you: Te l\'ho detto vs Te l\'ho detta.</div>'+
    '</div>'+
    '<div class="wrap"><h3>Summary — four steps</h3>'+
      '<div class="plain"><b>1.</b> Identify the indirect pronoun (TO WHOM) and the direct one (WHAT).</div>'+
      '<div class="plain"><b>2.</b> Combine them: mi→me, ti→te, gli/le→glie-, ci→ce, vi→ve.</div>'+
      '<div class="plain"><b>3.</b> Place them before the verb — or attached to an infinitive or affirmative imperative.</div>'+
      '<div class="plain"><b>4.</b> Agree the past participle with the direct pronoun.</div>'+
    '</div>';
  $("studyBody").querySelectorAll("[data-say]").forEach(el=> el.onclick=()=>speak(el.dataset.say));
}
function drawIdioms(){
  $("studyTitle").textContent="Idiomatic expressions";
  $("studyBody").innerHTML =
    '<div class="wrap"><h3>Frozen combined pronouns</h3>'+
      IDIOMS.map(([e,m,ex])=>'<div class="r" data-say="'+esc(ex)+'"><div class="p">'+esc(e)+
        '</div><div class="f">'+esc(m)+'</div><div class="x">'+esc(ex)+'</div></div>').join("")+
      '<div class="plain">In these verbs the <b>la</b> and the <b>ne</b> no longer point at anything — they are part of '+
        'the verb itself. That is why the participle stays fatta, cavata, presa whatever you are talking about.</div>'+
      '<div class="note">These are essential in everyday speech: <i>Ce la fai?</i> (can you manage?) and '+
        '<i>Ce l\'ho fatta!</i> (I did it!) are heard constantly.</div>'+
    '</div>'+
    '<div class="wrap"><h3>In conversation</h3>'+
      '<div class="r" data-say="Come va l\'esame? Me la sto cavando!"><div class="p" style="width:auto;flex:1">— Come va l\'esame? — Me la sto cavando!</div></div>'+
      '<div class="r" data-say="Perché ce l\'hai con Marco? Perché mi ha deluso."><div class="p" style="width:auto;flex:1">— Perché ce l\'hai con Marco? — Perché mi ha deluso.</div></div>'+
      '<div class="r" data-say="È difficile? Sì, ce ne vuole per impararlo!"><div class="p" style="width:auto;flex:1">— È difficile? — Sì, ce ne vuole per impararlo!</div></div>'+
      '<div class="r" data-say="Hai finito? Sì, ce l\'ho fatta!"><div class="p" style="width:auto;flex:1">— Hai finito? — Sì, ce l\'ho fatta!</div></div>'+
    '</div>';
  $("studyBody").querySelectorAll("[data-say]").forEach(el=> el.onclick=()=>speak(el.dataset.say));
}
function setTab(t){
  studyTab=t;
  $("tabTable").classList.toggle("on", t==="table");
  $("tabRules").classList.toggle("on", t==="rules");
  $("tabIdioms").classList.toggle("on", t==="idioms");
  t==="table" ? drawTable() : (t==="rules" ? drawRules() : drawIdioms());
}
$("tabTable").onclick  = ()=>setTab("table");
$("tabRules").onclick  = ()=>setTab("rules");
$("tabIdioms").onclick = ()=>setTab("idioms");
$("studyBtn").onclick   = ()=>{ setTab(studyTab); $("studySheet").classList.add("open"); };
$("studyClose").onclick = ()=> $("studySheet").classList.remove("open");

/* ---------------- BOOT ---------------- */
syncModeBtn();
buildDeck();
</script>
