<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1216">
<title>Verbi pronominali</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-screen study app — header, filter chips, a single card, rating bar pinned below. Mirrors the italianverbs.html deck. */
:root{
  --bg:#0f1216; --panel:#181d24; --panel2:#212832; --line:#2c343f;
  --txt:#eef2f6; --dim:#93a1b1; --faint:#5d6b7a;
  --accent:#4ade80; --accent-ink:#06210f; --accent2:#38bdf8; --amber:#fbbf24;
  --red:#f87171; --again-bg:#3a2226; --good-bg:#12301f;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f5f8; --panel:#ffffff; --panel2:#e9edf2; --line:#d3dae3;
  --txt:#141a21; --dim:#566372; --faint:#8794a3;
  --accent:#15803d; --accent-ink:#ffffff; --accent2:#0369a1; --amber:#a16207;
  --red:#b91c1c; --again-bg:#fde8e8; --good-bg:#dcf5e5; color-scheme:light }}
:root[data-theme="light"]{
  --bg:#f3f5f8; --panel:#ffffff; --panel2:#e9edf2; --line:#d3dae3;
  --txt:#141a21; --dim:#566372; --faint:#8794a3;
  --accent:#15803d; --accent-ink:#ffffff; --accent2:#0369a1; --amber:#a16207;
  --red:#b91c1c; --again-bg:#fde8e8; --good-bg:#dcf5e5; color-scheme:light }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:var(--body);font-size:15px;
  display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;flex:1;gap:10px;padding-block:12px}
header{display:flex;align-items:center;gap:8px}
h1{font-family:var(--display);font-size:18px;margin:0;flex:1;letter-spacing:.2px}
h1 span{color:var(--accent)}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;
  padding:8px 11px;font:600 13px var(--body);cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:6px 11px;
  border-radius:99px;font:600 13px var(--body);cursor:pointer}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .n{opacity:.6;font-weight:400;margin-left:3px}
.bar{height:4px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
main{flex:1;display:flex;align-items:center}
.card{width:100%;min-height:46vh;background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:40px 20px 34px;cursor:pointer;position:relative}
.tag{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--dim);white-space:nowrap}
.prompt{font-size:14px;color:var(--accent2);font-weight:700;margin-bottom:4px}
.big{font-family:var(--display);font-size:clamp(28px,8.5vw,42px);font-weight:700;line-height:1.15;margin:6px 0;text-wrap:balance}
.sub{font-size:15px;color:var(--dim);line-height:1.5;margin-top:6px;text-wrap:balance}
.ans{display:none;width:100%}
.card.flipped .ans{display:block}
.card.flipped .hint{display:none}
.hint{position:absolute;bottom:14px;font-size:11px;color:var(--faint);letter-spacing:.5px}
.ex{margin:16px auto 0;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);max-width:380px}
.exit{font-size:18px;font-weight:700;line-height:1.4}
.exen{font-size:13px;color:var(--dim);margin-top:5px}
.note{font-size:12.5px;color:var(--amber);margin-top:12px;line-height:1.5;max-width:380px;margin-inline:auto}
.spk{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.spk button{background:var(--panel2);color:var(--accent2);border:1px solid var(--line);border-radius:99px;
  padding:8px 14px;font:700 13px var(--body);cursor:pointer}
footer{padding-bottom:env(safe-area-inset-bottom,0px)}
.rate{display:flex;gap:10px}
.rate button,.single{flex:1;width:100%;padding:15px 0;border-radius:14px;border:none;font:700 15px var(--body);cursor:pointer}
.again{background:var(--again-bg);color:var(--red)}
.good{background:var(--good-bg);color:var(--accent)}
.single{background:var(--panel2);color:var(--txt)}
.toolrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toolrow .btn{font-size:12px;padding:6px 10px}
.btn.armed{background:var(--again-bg);color:var(--red);border-color:var(--red)}
@media (prefers-reduced-motion: reduce){ .bar i{transition:none} .btn:active,.rate button:active{transform:none} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Verbi <span>pronominali</span></h1>
    <button class="btn" id="modeBtn" type="button">Recall</button>
    <button class="btn" id="shufBtn" type="button">🔀</button>
  </header>
  <div class="chips" id="groups" role="group" aria-label="Pronoun groups"></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="meta"><span id="counter">—</span><span id="score">—</span></div>
  <main>
    <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard, tap to reveal">
      <div class="tag" id="tag"></div>
      <div id="front"></div>
      <div class="ans" id="back"></div>
      <div class="hint">tap to reveal</div>
    </div>
  </main>
  <footer><div id="controls"></div></footer>
  <div class="toolrow">
    <button class="btn" id="autoBtn" type="button">Speak on reveal</button>
    <button class="btn" id="resetBtn" type="button">Reset known cards</button>
  </div>
</div>

<script>
const GROUPS = {
  ci:   {label:"-ci",   note:"ci is fixed: it often means \"it / there\", but in these verbs it's part of an idiom. Passato prossimo usually takes avere (ci ho messo un'ora), except verbs of motion/state like volerci, entrarci, starci, cascarci (ci è voluto, ci sono cascato)."},
  ne:   {label:"-ne",   note:"ne means \"of it / about it\" and is frozen into the expression."},
  la:   {label:"-la",   note:"la refers to a vague \"it\" (the situation). Passato prossimo uses avere, and the participle agrees with la: l'ha fatta franca, l'ha presa male."},
  sene: {label:"-sene", note:"Reflexive si + ne. si becomes se before ne (me ne, te ne, se ne, ce ne, ve ne, se ne). Reflexive, so passato prossimo takes essere: me ne sono andato/a."},
  cela: {label:"-cela", note:"ci + la → ce la. Passato prossimo takes avere and agrees with la: ce l'ho fatta."},
  sela: {label:"-sela", note:"Reflexive si + la → se la (me la, te la, se la, ce la, ve la, se la). Reflexive, so passato prossimo takes essere and agrees with la: me la sono cavata."}
};
const CARDS = [
  ["ci","volerci","to take (time / things needed)","Ci vuole pazienza.","It takes patience."],
  ["ci","metterci","to take (time, for a person)","Ci metto un'ora.","It takes me an hour."],
  ["ci","entrarci","to have to do with; to fit","Io non c'entro!","It's got nothing to do with me!"],
  ["ci","sentirci","to be able to hear","Non ci sento.","I can't hear."],
  ["ci","vederci","to be able to see","Non ci vedo senza occhiali.","I can't see without glasses."],
  ["ci","tenerci","to care about","Ci tengo tanto.","It means a lot to me."],
  ["ci","crederci","to believe (in it)","Non ci credo!","I don't believe it!"],
  ["ci","pensarci","to think about it; to take care of it","Ci penso io.","I'll take care of it."],
  ["ci","contarci","to count on it","Ci conto!","I'm counting on it!"],
  ["ci","provarci","to try; to hit on someone","Ci provo.","I'll give it a try."],
  ["ci","starci","to be up for it; to fit","Ci stai?","Are you in?"],
  ["ci","cascarci","to fall for it","Ci sono cascato!","I fell for it!"],
  ["ci","capirci","to understand (it)","Non ci capisco niente.","I can't make sense of it."],
  ["ci","arrivarci","to get it, figure it out","Non ci arrivo.","I don't get it."],
  ["ci","rimetterci","to lose out","Ci ho rimesso 100 euro.","I lost 100 euros on it."],
  ["ne","valerne la pena","to be worth it","Ne vale la pena.","It's worth it."],
  ["ne","poterne più","to be fed up","Non ne posso più!","I can't take it anymore!"],
  ["ne","volerne a qualcuno","to hold a grudge","Non me ne volere.","Don't hold it against me."],
  ["ne","farne a meno","to do without","Non posso farne a meno.","I can't do without it."],
  ["ne","andarne di","to be at stake","Ne va del mio lavoro.","My job is at stake."],
  ["la","smetterla","to stop it","Smettila!","Stop it!"],
  ["la","finirla","to stop it, quit","Finiscila!","Quit it!"],
  ["la","farla finita","to be done with it","Facciamola finita.","Let's be done with it."],
  ["la","piantarla","to cut it out","Piantala!","Cut it out!"],
  ["la","farla franca","to get away with it","L'ha fatta franca.","He got away with it."],
  ["la","prenderla (bene / male)","to take it (well / badly)","L'ha presa male.","She took it badly."],
  ["la","saperla lunga","to know the score, be a smart one","Quello la sa lunga.","That guy knows the score."],
  ["sene","andarsene","to leave, go away","Me ne vado.","I'm leaving."],
  ["sene","fregarsene","to not care (informal)","Me ne frego.","I don't care."],
  ["sene","infischiarsene","to not give a hoot","Se ne infischia.","He couldn't care less."],
  ["sene","intendersene","to be an expert in","Te ne intendi di vino?","Do you know a lot about wine?"],
  ["sene","starsene","to stay (quietly)","Me ne sto a casa.","I'm staying home."],
  ["sene","tornarsene","to go back (home)","Me ne torno a casa.","I'm heading back home."],
  ["sene","approfittarsene","to take advantage","Se ne approfitta.","He takes advantage of it."],
  ["sene","uscirsene con","to come out with (a remark)","Se n'è uscito con una battuta.","He came out with a joke."],
  ["cela","farcela","to manage, make it","Ce la faccio!","I can do it!"],
  ["cela","avercela con","to be mad at","Ce l'hai con me?","Are you mad at me?"],
  ["cela","mettercela tutta","to give it your all","Ce la metto tutta.","I'm giving it my all."],
  ["sela","cavarsela","to get by","Me la cavo con l'italiano.","I get by in Italian."],
  ["sela","prendersela","to get upset, take offense","Non te la prendere!","Don't take it badly!"],
  ["sela","godersela","to enjoy it","Godetevela!","Enjoy it!"],
  ["sela","passarsela (bene / male)","to be doing (well / badly)","Come te la passi?","How are you doing?"],
  ["sela","filarsela","to sneak off","Se l'è filata.","He sneaked off."],
  ["sela","squagliarsela","to slip away","Ce la siamo squagliata.","We slipped away."],
  ["sela","spassarsela","to have a great time","Se la spassano.","They're having a blast."],
  ["sela","sbrigarsela","to handle it, sort it out","Sbrigatela tu!","You handle it!"],
  ["sela","vedersela brutta","to have a close call","Me la sono vista brutta.","I had a close call."],
  ["sela","cercarsela","to ask for it (trouble)","Se l'è cercata.","He asked for it."],
  ["sela","legarsela al dito","to hold a grudge","Me la sono legata al dito.","I'm holding a grudge about it."],
  ["sela","tirarsela","to show off, act stuck-up","Se la tira.","He's showing off."]
].map(([g,inf,en,it,ex])=>({g,inf,en,it,ex,id:inf}));

const KEY="verbi_pronominali_v1";
let S={mode:"recall",groups:Object.keys(GROUPS),known:{},seen:0,right:0,speak:false};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const $=id=>document.getElementById(id);
let deck=[],pos=0,flipped=false;

/* Italian voice, same approach as the verb deck: never fall back to English */
let itVoice=null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs=speechSynthesis.getVoices().filter(v=>/^it/i.test(v.lang));
  const rank=v=>(/premium|enhanced|siri/i.test(v.name)?40:0)+(/alice|federica|luca/i.test(v.name)?20:0)+(v.localService?10:0);
  vs.sort((a,b)=>rank(b)-rank(a)); itVoice=vs[0]||null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(t){
  if(!("speechSynthesis" in window)) return;
  if(!itVoice) pickVoice(); if(!itVoice) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.voice=itVoice; u.lang=itVoice.lang; u.rate=.95;
  speechSynthesis.speak(u);
}

function drawGroups(){
  $("groups").innerHTML=Object.entries(GROUPS).map(([k,g])=>{
    const n=CARDS.filter(c=>c.g===k).length;
    return '<button type="button" class="chip '+(S.groups.includes(k)?'sel':'')+'" data-g="'+k+'">'+g.label+'<span class="n">'+n+'</span></button>';
  }).join("");
  $("groups").querySelectorAll(".chip").forEach(el=>el.onclick=()=>{
    const k=el.dataset.g;
    S.groups=S.groups.includes(k)?S.groups.filter(x=>x!==k):S.groups.concat(k);
    save(); drawGroups(); build(false);
  });
}
function build(shuffle){
  deck=CARDS.filter(c=>S.groups.includes(c.g)&&!S.known[c.id]);
  if(shuffle) for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  pos=0; render();
}
function render(){
  $("card").classList.remove("flipped"); flipped=false;
  $("controls").innerHTML='<button class="single" id="revealBtn" type="button">Reveal</button>';
  $("revealBtn").onclick=flip;
  const pct=S.seen?Math.round(S.right/S.seen*100)+"% correct ("+S.seen+" answered)":"no answers yet";
  $("score").textContent=pct;
  if(!deck.length){
    $("tag").textContent="";
    $("front").innerHTML='<div class="big">Tutto fatto! ✓</div><div class="sub">'+
      (S.groups.length?'Every card in these groups is retired as known. Tap “Reset known cards” to study them again.':'Pick at least one group above.')+'</div>';
    $("back").innerHTML=""; $("counter").textContent="—"; $("barFill").style.width="0";
    $("controls").innerHTML=""; return;
  }
  if(pos>=deck.length){ build(true); return; }
  const c=deck[pos], g=GROUPS[c.g];
  $("tag").textContent=g.label+" verbs";
  if(S.mode==="recall"){
    $("front").innerHTML='<div class="prompt">What does it mean?</div><div class="big">'+c.inf+'</div>';
    $("back").innerHTML='<div class="big" style="color:var(--accent);font-size:clamp(22px,6vw,30px)">'+c.en+'</div>'+exBlock(c);
  }else{
    $("front").innerHTML='<div class="prompt">Say it in Italian</div><div class="big" style="font-size:clamp(24px,7vw,34px)">'+c.en+'</div><div class="sub">'+c.ex+'</div>';
    $("back").innerHTML='<div class="big" style="color:var(--accent)">'+c.inf+'</div>'+exBlock(c);
  }
  $("counter").textContent=(pos+1)+" / "+deck.length+" left";
  $("barFill").style.width=(pos/deck.length*100)+"%";
}
function exBlock(c){
  return '<div class="ex"><div class="exit">'+c.it+'</div><div class="exen">'+c.ex+'</div></div>'+
    '<div class="spk"><button type="button" id="spkS">🔊 frase</button><button type="button" id="spkV">🔊 verbo</button></div>'+
    '<div class="note">'+GROUPS[c.g].note+'</div>';
}
function flip(){
  if(!deck.length||flipped) return;
  flipped=true; $("card").classList.add("flipped");
  const c=deck[pos];
  $("spkS").onclick=e=>{e.stopPropagation();speak(c.it);};
  $("spkV").onclick=e=>{e.stopPropagation();speak(c.inf.replace(/\(.*?\)/g,""));};
  if(S.speak) speak(c.it);
  $("controls").innerHTML='<div class="rate"><button class="again" id="againBtn" type="button">Again</button><button class="good" id="goodBtn" type="button">Got it</button></div>';
  $("againBtn").onclick=()=>rate(false);
  $("goodBtn").onclick=()=>rate(true);
}
function rate(ok){
  const c=deck[pos];
  S.seen++; if(ok){S.right++; S.known[c.id]=true;}
  else deck.splice(Math.min(pos+6,deck.length),0,c);   // missed cards come back ~6 cards later
  save(); pos++; render();
}
$("card").onclick=()=>flip();
$("card").onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();} };
$("modeBtn").onclick=()=>{ S.mode=S.mode==="recall"?"produce":"recall"; save(); setMode(); render(); };
function setMode(){ $("modeBtn").textContent=S.mode==="recall"?"Recall":"Produce"; }
$("shufBtn").onclick=()=>build(true);
$("autoBtn").onclick=()=>{ S.speak=!S.speak; save(); $("autoBtn").classList.toggle("on",S.speak); };
$("resetBtn").onclick=()=>{
  const b=$("resetBtn");
  if(b.dataset.armed){ clearTimeout(b._t); delete b.dataset.armed; b.classList.remove("armed");
    b.textContent="Reset known cards"; S.known={}; save(); build(true); return; }
  b.dataset.armed="1"; b.classList.add("armed"); b.textContent="Tap again to confirm";
  b._t=setTimeout(()=>{delete b.dataset.armed;b.classList.remove("armed");b.textContent="Reset known cards";},4000);
};
document.addEventListener("keydown",e=>{
  if(!flipped) return;
  if(e.key==="1"||e.key==="ArrowLeft") rate(false);
  if(e.key==="2"||e.key==="ArrowRight") rate(true);
});
setMode(); $("autoBtn").classList.toggle("on",!!S.speak);
drawGroups(); build(true);
</script>
</body>
</html>
